<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>稅務視訊服務雲｜TAX 小幫手互動教學</title>
<style>
:root{--blue:#1768df;--blue2:#5d69df;--navy:#173b7a;--ink:#2a3853;--muted:#71819d;--line:#dce7f5;--orange:#f49a2b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
body{background:linear-gradient(180deg,#fafdff,#eef7ff 58%,#f8faff)}
.app{max-width:1450px;margin:auto;padding:18px}
.shell{min-height:calc(100vh - 36px);position:relative;overflow:hidden;border:1px solid rgba(132,168,221,.28);border-radius:34px;background:linear-gradient(180deg,rgba(255,255,255,.99),rgba(242,248,255,.98));box-shadow:0 30px 90px rgba(47,82,145,.14)}
.shell:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 92% 25%,rgba(117,198,255,.16),transparent 24%),linear-gradient(125deg,transparent 64%,rgba(122,193,255,.07) 65%,transparent 78%)}
.header{position:relative;z-index:2;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;padding:22px 28px 14px}
.badge{padding:12px 20px;border-radius:18px;background:linear-gradient(135deg,#0f62d8,#5374e6);color:#fff;font-weight:950;font-size:1.18rem;box-shadow:0 10px 24px rgba(42,87,185,.19)}
.header h1{margin:0;font-size:clamp(1.9rem,3vw,3.05rem);line-height:1.12;color:var(--navy);letter-spacing:-.05em}
.header p{margin:7px 0 0;color:#426091;font-weight:760;font-size:clamp(.9rem,1.1vw,1.05rem)}
.brand{font-size:.78rem;font-weight:900;color:#5f77a6}
.content{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;padding:0 28px 16px}
.visual{min-height:610px;border:1px solid var(--line);border-radius:26px;padding:12px;background:#fff;box-shadow:0 18px 45px rgba(44,79,135,.10);overflow:hidden}
.visual img{width:100%;height:100%;object-fit:contain;display:block;border-radius:16px;background:#fff;transition:opacity .32s ease,transform .44s cubic-bezier(.2,.8,.2,1)}
.visual.changing img{opacity:.16;transform:translateX(18px) scale(.995)}
.side{display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.speech{position:relative;padding:18px 19px;margin-top:118px;border:2px solid #2d76df;border-radius:24px;background:#fff;box-shadow:0 14px 34px rgba(49,86,145,.10)}
.speech:after{content:"";position:absolute;left:48px;bottom:-22px;border:11px solid transparent;border-top-color:#2d76df}
.speech b{display:block;color:#315890;font-size:.76rem;margin-bottom:8px}
.speech p{margin:0;font-size:.98rem;line-height:1.72;font-weight:760;color:#304e84}
.mascot{position:relative;min-height:340px;display:flex;align-items:flex-end;justify-content:center}
.mascot img{max-width:100%;max-height:330px;object-fit:contain;display:block;filter:drop-shadow(0 14px 24px rgba(45,74,120,.12));animation:float 3.4s ease-in-out infinite}
.tag{position:absolute;right:12px;bottom:12px;padding:8px 14px;border-radius:12px;background:#1559b8;color:#fff;font-size:.82rem;font-weight:950;box-shadow:0 8px 20px rgba(35,77,157,.18)}
.reminder{position:relative;z-index:2;display:flex;align-items:center;gap:12px;margin:0 28px 14px;padding:13px 18px;border:1px solid rgba(244,154,44,.38);border-radius:18px;background:linear-gradient(180deg,#fffaf4,#fff4e8)}
.reminder .icon{font-size:1.5rem}.reminder b{color:#e57a18;margin-right:6px}.reminder span{font-size:.9rem;font-weight:720}
.nav{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:0 28px 22px}
.left,.right{display:flex;align-items:center;gap:8px}.right{justify-content:flex-end}
.btn{border:0;border-radius:999px;padding:12px 22px;font-size:.9rem;font-weight:900;transition:.2s}
.btn.prev{background:#fff;border:1px solid #d7e3f2;color:#34558f}.btn.next{background:linear-gradient(135deg,#1764d6,#4d76e7);color:#fff;box-shadow:0 10px 24px rgba(37,86,186,.18)}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.35;transform:none}

.progress{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border:0;border-radius:999px;background:#d9e4f4;padding:0;transition:.25s}.dot.done{background:#94aade}.dot.active{width:34px;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.counter{min-width:48px;text-align:center;font-size:.78rem;color:#6077a4;font-weight:900}
.overviewBtn{position:absolute;right:22px;top:20px;z-index:5;width:42px;height:42px;border-radius:13px;border:1px solid #dbe6f3;background:#fff;color:#55719f;font-weight:950}
.overview{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(17,29,49,.64);backdrop-filter:blur(8px)}.overview.open{display:flex}
.panel{width:min(1080px,94vw);max-height:88vh;overflow:auto;padding:18px;border-radius:24px;background:#f9fcff;box-shadow:0 30px 90px rgba(0,0,0,.25)}.close{display:block;margin-left:auto;margin-bottom:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#385b91;font-weight:950}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.thumb{border:1px solid #dce6f4;background:#fff;border-radius:14px;padding:8px;text-align:left}.thumb.active{outline:2px solid rgba(46,105,218,.42)}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:9px;display:block;margin-bottom:7px}.thumb b{font-size:.72rem;color:#34558c}.thumb span{display:block;font-size:.67rem;color:#7888a3;margin-top:3px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-.2deg)}50%{transform:translateY(-7px) rotate(.3deg)}}
@media(max-width:1040px){.content{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.mascot{min-height:260px}.mascot img{max-height:250px}}
@media(max-width:720px){.app{padding:8px}.shell{border-radius:24px}.header{grid-template-columns:1fr;padding:16px 14px 10px}.badge{width:max-content}.content{padding:0 12px 12px}.visual{min-height:420px}.side{grid-template-columns:1fr}.reminder{margin:0 12px 12px}.nav{padding:0 12px 16px;grid-template-columns:1fr}.left,.right,.progress{justify-content:center}.grid{grid-template-columns:repeat(2,1fr)}}

/* ===== Premium refinement ===== */
body{
  background:
    radial-gradient(circle at 12% 0%,rgba(111,195,255,.22),transparent 28%),
    radial-gradient(circle at 96% 8%,rgba(105,102,224,.11),transparent 22%),
    linear-gradient(180deg,#fbfdff 0%,#eef7ff 58%,#f8faff 100%);
}
.shell{
  border-color:rgba(123,159,218,.24);
  background:
    radial-gradient(circle at 88% 28%,rgba(120,196,255,.11),transparent 22%),
    linear-gradient(180deg,rgba(255,255,255,.995),rgba(244,249,255,.985));
  box-shadow:0 34px 100px rgba(41,77,139,.13);
}
.header{padding:24px 30px 16px;gap:22px}
.badge{
  padding:11px 18px;
  border-radius:15px;
  font-size:1.08rem;
  letter-spacing:.025em;
  box-shadow:0 9px 22px rgba(42,87,185,.17);
}
.header h1{font-weight:950;letter-spacing:-.055em}
.header p{color:#536d9d;font-weight:720}
.brand{
  padding:7px 11px;border-radius:999px;
  border:1px solid rgba(107,139,198,.18);
  background:rgba(255,255,255,.74);
  color:#6279a8;
}
.content{
  grid-template-columns:minmax(0,1fr) 340px;
  gap:22px;
  padding:0 30px 18px;
}
.visual{
  position:relative;
  min-height:620px;
  padding:10px;
  border-radius:28px;
  border-color:rgba(134,166,216,.22);
  background:linear-gradient(180deg,#fff,#fbfdff);
  box-shadow:0 22px 54px rgba(43,77,132,.10);
}
.visual img{
  border-radius:19px;
  box-shadow:inset 0 0 0 1px rgba(128,158,205,.08);
}
.side{
  justify-content:flex-end !important;
  gap:0 !important;
  padding-bottom:0;
}
.speech{
  margin-top:0 !important;
  margin-bottom:-10px;
  z-index:4;
  padding:18px 20px 19px;
  border:1.7px solid #4f83dd;
  border-radius:23px;
  background:linear-gradient(180deg,rgba(255,255,255,.99),rgba(251,253,255,.99));
  box-shadow:0 16px 34px rgba(48,86,145,.09);
}
.speech:after{
  left:50%;
  bottom:-19px;
  transform:translateX(-50%);
  border-width:10px;
  border-top-color:#4f83dd;
}
.speech:before{
  content:"";
  position:absolute;
  left:50%;
  bottom:-16px;
  transform:translateX(-50%);
  border:9px solid transparent;
  border-top-color:#fff;
  z-index:2;
}
.speechHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:9px;
}
.speechHead b{
  margin:0 !important;
  font-size:.8rem;
  letter-spacing:.02em;
}
.guideStatus{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 8px;border-radius:999px;
  background:#eef5ff;color:#5571a8;
  font-size:.64rem;font-weight:900;white-space:nowrap;
}
.guideStatus i{
  width:6px;height:6px;border-radius:50%;
  background:#4e83e4;
  animation:guidePulse 1.25s ease-in-out infinite;
}
.guideStatus em{
  width:3px;height:3px;border-radius:50%;
  background:#8199c7;display:inline-block;
  animation:guideDot 1s ease-in-out infinite;
}
.guideStatus em:nth-last-child(2){animation-delay:.15s}
.guideStatus em:nth-last-child(1){animation-delay:.3s}
.speech p{
  font-size:1rem;
  line-height:1.68;
  color:#344f81;
  font-weight:750;
}
.mascot{
  min-height:340px !important;
  align-items:flex-end !important;
  justify-content:center !important;
  margin-top:0 !important;
}
.mascot img{
  max-height:330px !important;
  filter:drop-shadow(0 16px 24px rgba(44,73,120,.10));
  animation:floatPremium 3.8s ease-in-out infinite;
}
.tag{
  right:18px;bottom:18px;
  padding:7px 13px;
  border-radius:10px;
  font-size:.78rem;
  background:linear-gradient(135deg,#1557b2,#356fce);
}
.reminder{
  margin:0 30px 16px;
  padding:12px 17px;
  border-radius:16px;
  border-color:rgba(244,154,44,.32);
  background:linear-gradient(180deg,#fffbf5,#fff6eb);
}
.reminder .icon{font-size:1.35rem}
.nav{padding:0 30px 24px}
.btn{
  min-height:44px;
  padding:11px 21px;
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease;
}
.btn.prev:hover{background:#f8fbff;box-shadow:0 8px 18px rgba(52,83,132,.07)}
.btn.next{
  box-shadow:0 10px 22px rgba(37,86,186,.16);
}
.btn.next:hover{box-shadow:0 13px 28px rgba(37,86,186,.22)}


.dot{cursor:pointer}
.overviewBtn{
  right:25px;top:22px;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(48,82,139,.06);
}
.zoomBtn{
  position:absolute;
  right:22px;bottom:22px;
  z-index:3;
  border:1px solid rgba(116,150,205,.24);
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(8px);
  color:#506c9d;
  border-radius:999px;
  padding:8px 12px;
  font:800 .72rem "Noto Sans TC","Microsoft JhengHei",sans-serif;
  opacity:0;
  transform:translateY(6px);
  transition:.2s ease;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(44,76,127,.08);
}
.visual:hover .zoomBtn{opacity:1;transform:translateY(0)}
.imageModal{
  position:fixed;inset:0;z-index:80;
  display:none;align-items:center;justify-content:center;
  padding:30px;background:rgba(13,23,40,.76);
  backdrop-filter:blur(8px);
}
.imageModal.open{display:flex}
.imageModal img{
  max-width:95vw;max-height:90vh;
  border-radius:18px;background:#fff;
  box-shadow:0 34px 100px rgba(0,0,0,.32);
}
.imageModalClose{
  position:fixed;right:26px;top:22px;
  width:44px;height:44px;border:0;border-radius:50%;
  background:#fff;color:#3c5988;font-size:1.15rem;font-weight:950;
  cursor:pointer;
}
@keyframes guidePulse{0%,100%{opacity:.38;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
@keyframes guideDot{0%,100%{transform:translateY(0);opacity:.35}50%{transform:translateY(-2px);opacity:1}}
@keyframes floatPremium{
  0%,100%{transform:translateY(0) rotate(-.15deg)}
  50%{transform:translateY(-6px) rotate(.25deg)}
}
@media(max-width:1040px){
  .content{grid-template-columns:1fr}
  .side{display:grid !important;grid-template-columns:1fr 1fr;gap:14px !important}
  .speech{margin-bottom:0}
  .speech:after,.speech:before{display:none}
}
@media(max-width:720px){
  .content{padding:0 12px 12px}
  .visual{min-height:420px}
  .side{grid-template-columns:1fr !important}
  .zoomBtn{opacity:1;transform:none}
}

</style>
</head>
<body>
<div class="app">
  <main class="shell">
    <button class="overviewBtn" id="overviewBtn">☰</button>
    <header class="header">
      <div class="badge" id="badge"></div>
      <div>
        <h1 id="title"></h1>
        <p id="sub"></p>
      </div>
      <div class="brand">TAX 小幫手互動教學</div>
    </header>

    <section class="content">
      <div class="visual" id="visual">
        <img id="visualImg" alt="操作畫面">
        <button class="zoomBtn" id="zoomBtn" type="button" title="放大操作畫面">⛶ 放大</button>
      </div>
      <aside class="side">
        <div class="speech">
          <div class="speechHead">
            <b>TAX 小幫手</b>
            <span class="guideStatus"><i></i> 教學中 <em></em><em></em><em></em></span>
          </div>
          <p id="talk"></p>
        </div>
        <div class="mascot">
          <img src="tax-helper-wave.webp" alt="TAX 小幫手">
          <div class="tag">TAX 小幫手</div>
        </div>
      </aside>
    </section>

    <div class="reminder"><div class="icon">📣</div><div><b>小提醒：</b><span id="tip"></span></div></div>

    <nav class="nav">
      <div class="left"><button class="btn prev" id="prev">← 上一步</button></div>
      <div class="progress" id="progress"></div>
      <div class="right"><span class="counter" id="counter"></span><button class="btn next" id="next">下一步 →</button></div>
    </nav>
  </main>
</div>

<div class="imageModal" id="imageModal">
  <button class="imageModalClose" id="imageModalClose" type="button">×</button>
  <img id="imageModalImg" alt="放大操作畫面">
</div>

<div class="overview" id="overview">
  <div class="panel"><button class="close" id="close">×</button><div class="grid" id="grid"></div></div>
</div>

<script>
const STEPS=[{"title":"開啟虛擬背景設定","sub":"正式開始視訊服務前，先設定本處統一使用的虛擬背景。","talk":"進入視訊會議後，點選右下角「⋯」更多功能，再點選「選擇背景」，開啟虛擬背景設定。","tip":"建議於服務開始前先完成背景設定，畫面會更一致、專業。","img":"assets/video-guide/embedded-01.png"},{"title":"新增虛擬背景","sub":"進入「虛擬背景」頁面後，新增本處指定的背景圖片。","talk":"在設定中的「虛擬背景」頁面，點選「＋ 新增背景」，準備從電腦硬碟選取背景圖檔。","tip":"請使用本處提供的「虛擬背板」圖檔，不建議自行使用其他背景。","img":"assets/video-guide/embedded-02.png"},{"title":"選擇「虛擬背板」並套用","sub":"從電腦硬碟選取「虛擬背板」後，確認套用完成。","talk":"點選「新增背景」後，從電腦硬碟找到本處提供的「虛擬背板」圖檔，選取並套用；確認畫面已顯示統一背景後，再開始提供視訊服務。","tip":"若背景未正常顯示，可重新進入「選擇背景」確認是否已選取正確圖檔。","img":"assets/video-guide/embedded-03.png"},{"title":"開啟鏡頭與麥克風權限","sub":"進入視訊會議前，先允許瀏覽器使用鏡頭與麥克風。","talk":"點選「造訪這個網站時允許」，完成鏡頭與麥克風權限設定。","tip":"若選擇「不允許」，將無法正常進行視訊服務。","img":"assets/video-guide/embedded-04.jpg"},{"title":"接通後確認鏡頭與麥克風","sub":"接通後，再確認鏡頭與麥克風皆為開啟狀態。","talk":"確認攝影機與麥克風都顯示為開啟，再進行下一步。","tip":"權限未開啟時，可由網址列旁的權限圖示重新設定。","img":"assets/video-guide/embedded-05.jpg"},{"title":"點選加入會議完成連線","sub":"確認設備狀態無誤後，即可正式進入會議。","talk":"確認畫面無誤後，點選「加入會議」，稍候系統完成連線。","tip":"加入前請再確認鏡頭與麥克風都已開啟。","img":"assets/video-guide/embedded-06.jpg"},{"title":"確認會議人數","sub":"畫面顯示 2 人，代表您與民眾皆已成功進入會議。","talk":"查看與會人數，確認畫面顯示 2 人即可。","tip":"若不是 2 人，請先確認民眾是否已成功加入。","img":"assets/video-guide/embedded-07.jpg"},{"title":"說明錄音錄影並取得同意","sub":"完成服務禮貌用語後，先向民眾說明錄音錄影事項。","talk":"完成開場話術後按「關閉」，再向民眾說明全程錄音錄影並取得同意。","tip":"若民眾不同意，請改引導其他線上申辦方式。","img":"assets/video-guide/embedded-08.jpg"},{"title":"確認申請項目與辦理身分","sub":"確認申請內容與本人／代理人身分後，再進行身分驗證。","talk":"確認民眾要辦理的項目、是否本人持有，並請民眾出示身分證。","tip":"如配戴口罩，請委婉請民眾暫時取下再進行辨識。","img":"assets/video-guide/embedded-09.jpg"},{"title":"至戶政司驗證身分證有效性","sub":"依證件內容輸入資料與驗證碼，再確認查驗結果。","talk":"輸入身分證資料與驗證碼後按「送出」，確認系統顯示資料相符。","tip":"請再核對民眾陳述資料與查驗結果是否一致。","img":"assets/video-guide/embedded-10.jpg"},{"title":"檢視法規及應備證明文件","sub":"快速確認民眾申請項目所需文件與相關法規。","talk":"點選「檢視法規及應備證明文件」，依畫面內容核對所需文件。","tip":"先確認申請項目正確，再逐項核對應備文件。","img":"assets/video-guide/embedded-11.jpg"},{"title":"填寫申辦資料與電子郵件驗證","sub":"與民眾核對填寫內容；選 Email 寄送時完成信箱驗證。","talk":"資料填寫完成後先與民眾核對；若選 Email 寄送，請完成信箱驗證。","tip":"看到信箱驗證成功後，再繼續後續送件。","img":"assets/video-guide/embedded-12.jpg"},{"title":"確認送件內容並完成送出","sub":"核對 PDF、選擇收件分處與匯入標的，完成正式送件。","talk":"開啟 PDF 與民眾核對資料，選好收件分處與匯入系統後按「送出」。","tip":"申請案件完成入案後，記得提醒民眾填寫滿意度調查。","img":"assets/video-guide/embedded-13.jpg"}];
let index=0;const $=id=>document.getElementById(id);
$('grid').innerHTML=STEPS.map((s,i)=>`<button class="thumb" data-i="${i}"><img src="${s.img}"><b>STEP ${i+1}</b><span>${s.title}</span></button>`).join('');
function render(n){
 if(n<0||n>=STEPS.length)return;
 const visual=$('visual');visual.classList.add('changing');
 setTimeout(()=>{
  index=n;const s=STEPS[index];
  $('badge').textContent=`STEP ${index+1}`;
  $('title').textContent=s.title;$('sub').textContent=s.sub;$('talk').textContent=s.talk;$('tip').textContent=s.tip;$('visualImg').src=s.img;
  $('prev').disabled=index===0;$('next').textContent=index===STEPS.length-1?'完成服務 ✓':'下一步 →';$('counter').textContent=`${index+1} / ${STEPS.length}`;
  $('progress').innerHTML=STEPS.map((_,i)=>`<button class="dot ${i===index?'active':i<index?'done':''}" data-i="${i}"></button>`).join('');
  document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>render(+b.dataset.i));
  document.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('active',i===index));
  visual.classList.remove('changing');
 },180);
}
$('prev').onclick=()=>render(index-1);$('next').onclick=()=>{if(index<STEPS.length-1)render(index+1)};
$('overviewBtn').onclick=()=>$('overview').classList.add('open');$('close').onclick=()=>$('overview').classList.remove('open');$('overview').onclick=e=>{if(e.target===$('overview'))$('overview').classList.remove('open')};
document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{render(+b.dataset.i);$('overview').classList.remove('open')});

const zoomBtn = document.getElementById('zoomBtn');
const imageModal = document.getElementById('imageModal');
const imageModalImg = document.getElementById('imageModalImg');
const imageModalClose = document.getElementById('imageModalClose');
zoomBtn.onclick = () => {
  imageModalImg.src = STEPS[index].img;
  imageModal.classList.add('open');
};
imageModalClose.onclick = () => imageModal.classList.remove('open');
imageModal.onclick = e => { if(e.target === imageModal) imageModal.classList.remove('open'); };

document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')render(index-1);if(e.key==='ArrowRight')render(index+1);if(e.key==='Escape'){$('overview').classList.remove('open');imageModal.classList.remove('open')}});render(0);
</script>
</body>
</html>
